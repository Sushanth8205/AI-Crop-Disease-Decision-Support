[tool.vercel]
entrypoint = "run:app"

[project]
name = "ai-crop-disease-decision-support"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0.0",
    "werkzeug>=3.0.0",
    "pymongo>=4.6.0",
    "python-dotenv>=1.0.0",
    "bcrypt>=4.1.0",
    "scikit-learn>=1.3.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "reportlab>=4.0.0",
    "google-genai>=0.1.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]
