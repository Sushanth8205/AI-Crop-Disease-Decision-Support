{% extends "base.html" %}
{% block content %}
<div class="auth-container glass-panel" style="max-width: 800px;">
    <h2>Agricultural Advisor Registration</h2>
    <form method="POST" action="{{ url_for('auth.register_advisor') }}">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <!-- Basic Details -->
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="tel" name="phone" required>
            </div>
            <div class="form-group">
                <label>State</label>
                <input type="text" name="state" required>
            </div>
            <div class="form-group">
                <label>District</label>
                <input type="text" name="district" required>
            </div>
            
            <!-- Professional Details -->
            <div class="form-group">
                <label>Experience (Years)</label>
                <input type="number" name="experience" min="1" required>
            </div>
            <div class="form-group">
                <label>Qualification</label>
                <input type="text" name="qualification" placeholder="e.g. BSc Agriculture" required>
            </div>
            <div class="form-group">
                <label>Crop Specialization</label>
                <input type="text" name="crop_specialization" placeholder="e.g. Tomatoes, Wheat" required>
            </div>
            <div class="form-group">
                <label>Disease Specialization</label>
                <input type="text" name="disease_specialization" placeholder="e.g. Blight, Rust" required>
            </div>
            <div class="form-group">
                <label>Available Days</label>
                <input type="text" name="available_days" placeholder="e.g. Mon-Fri" required>
            </div>
            <div class="form-group">
                <label>Available Time Slots</label>
                <input type="text" name="available_time_slots" placeholder="e.g. 10AM-2PM" required>
            </div>
        </div>
        <div class="form-group" style="margin-top: 1rem;">
            <label>Profile Description</label>
            <textarea name="profile_description" rows="4" style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid #ccc;" required></textarea>
        </div>
        <div class="form-group" style="grid-column: 1 / -1; margin-top: 1rem;">
            <label>📍 Select your exact practice location on the map</label>
            <p style="font-size: 0.85rem; color: #666; margin-bottom: 0.5rem;">Click on the map to set your location pin. We'll automatically fill the district and state fields above.</p>
            <div id="register-map" class="map-container" style="height: 300px; border-radius: 8px; border: 1px solid #ddd; z-index: 1;"></div>
            <input type="hidden" name="lat" id="lat-input">
            <input type="hidden" name="lng" id="lng-input">
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem;" id="submit-btn">Register as Advisor</button>
    </form>
    <p class="auth-links">Already have an account? <a href="{{ url_for('auth.login') }}">Login here</a></p>
</div>
{% endblock %}

{% block scripts %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('register-map').setView([20.5937, 78.9629], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let marker;

    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((pos) => {
            map.setView([pos.coords.latitude, pos.coords.longitude], 10);
        });
    }

    map.on('click', async function(e) {
        const lat = e.latlng.lat;
        const lng = e.latlng.lng;

        if (marker) {
            marker.setLatLng(e.latlng);
        } else {
            marker = L.marker(e.latlng).addTo(map);
        }

        document.getElementById('lat-input').value = lat;
        document.getElementById('lng-input').value = lng;

        try {
            const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
            const data = await response.json();
            
            if (data && data.address) {
                const address = data.address;
                if (address.state) document.querySelector('input[name="state"]').value = address.state;
                
                const district = address.state_district || address.county || address.district;
                if (district) document.querySelector('input[name="district"]').value = district.replace(/ District$/i, '');
            }
        } catch (error) {
            console.error("Error reverse geocoding:", error);
        }
    });

    document.querySelector('form').addEventListener('submit', function(e) {
        if (!document.getElementById('lat-input').value) {
            e.preventDefault();
            alert("Please click on the map to set your precise location.");
        }
    });
</script>
{% endblock %}
