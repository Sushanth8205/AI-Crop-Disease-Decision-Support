{% extends "base.html" %}
{% block content %}
<div class="chat-container glass-panel"
    style="width: 100%; max-width: 800px; display: flex; flex-direction: column; height: 70vh;">

    <div style="margin-bottom: 1rem; border-bottom: 1px solid var(--glass-border); padding-bottom: 1rem;">
        <h2 style="color: var(--primary-dark);">ML Based Crop Disease Detection AI Assistant</h2>
        <p style="font-size: 0.9rem; color: #555;">Context: {{ detection.crop }} - <span class="highlight-danger"
                style="font-size:1rem;">{{ detection.disease }}</span></p>
    </div>

    <div id="chat-box"
        style="flex: 1; overflow-y: auto; padding: 1rem; background: rgba(255,255,255,0.4); border-radius: 8px; border: 1px solid rgba(0,0,0,0.15); margin-bottom: 1rem; display: flex; flex-direction: column; gap: 1rem;">
        <!-- Initial Bot Message -->
        <div class="message bot-message">
            Hi! I see you have detected <b>{{ detection.disease }}</b> on your <b>{{ detection.crop }}</b>. How can I
            assist you with this today?
        </div>
    </div>

    <form id="chat-form" style="display: flex; gap: 1rem;">
        <select id="language-select"
            style="padding: 1rem; border-radius: 8px; border: 1px solid #ccc; font-size: 1rem; background: white; cursor: pointer;">
            <option value="English">English</option>
            <option value="Hindi">Hindi</option>
            <option value="Marathi">Marathi</option>
            <option value="Telugu">Telugu</option>
            <option value="Tamil">Tamil</option>
            <option value="Kannada">Kannada</option>
            
            <!-- <option value="Spanish">Spanish</option> -->

        </select>
        <input type="text" id="message-input" placeholder="Ask about causes, prevention, or treatments..." required
            style="flex: 1; padding: 1rem; border-radius: 8px; border: 1px solid #ccc; font-size: 1rem;">
        <button type="submit" class="btn btn-primary" id="send-btn">Send</button>
    </form>
</div>

<style>
    .message {
        padding: 1rem;
        border-radius: 12px;
        max-width: 80%;
        line-height: 1.5;
    }

    .user-message {
        background-color: var(--primary);
        color: white;
        align-self: flex-end;
        border-bottom-right-radius: 2px;
    }

    .bot-message {
        background-color: white;
        color: #333;
        align-self: flex-start;
        border-bottom-left-radius: 2px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
    }
</style>

<script>
    const chatForm = document.getElementById('chat-form');
    const messageInput = document.getElementById('message-input');
    const chatBox = document.getElementById('chat-box');
    const sendBtn = document.getElementById('send-btn');

    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const userMsg = messageInput.value.trim();
        if (!userMsg) return;

        // Append User Message
        appendMessage(userMsg, 'user-message');
        messageInput.value = '';

        // Disable input while fetching
        messageInput.disabled = true;
        sendBtn.disabled = true;

        // Add loading indicator
        const loadingId = appendMessage("Thinking...", 'bot-message');

        try {
            const formData = new FormData();
            formData.append('message', userMsg);
            formData.append('language', document.getElementById('language-select').value);

            const response = await fetch("{{ url_for('ai.ask_ai', detection_id=detection._id) }}", {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            // Replace loading with actual response
            document.getElementById(loadingId).innerHTML = data.reply.replace(/\n/g, '<br>');

        } catch (err) {
            document.getElementById(loadingId).innerHTML = "Sorry, an error occurred while connecting to the AI.";
        }

        // Re-enable
        messageInput.disabled = false;
        sendBtn.disabled = false;
        messageInput.focus();
    });

    function appendMessage(text, className) {
        const div = document.createElement('div');
        div.className = `message ${className}`;
        const id = 'msg-' + Date.now() + '-' + Math.floor(Math.random() * 10000);
        div.id = id;
        div.innerHTML = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        return id;
    }
</script>
{% endblock %}
